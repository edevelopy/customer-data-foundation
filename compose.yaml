services:
  database:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  database_test:
    profiles: ["test"]
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: fde_test
      POSTGRES_USER: fde_test
      POSTGRES_PASSWORD: test-only-password
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55434}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fde_test -d fde_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
