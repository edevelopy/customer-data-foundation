name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  image_changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.filter.outputs.publish }}
    steps:
      - name: Checkout complete history for change detection
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect image-affecting changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            .dockerignore Dockerfile README.md alembic.ini migrations pyproject.toml src uv.lock \
            .github/workflows/ci.yml; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: fde_test
          POSTGRES_USER: fde_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fde_test -d fde_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fde_test:ci-only-password@localhost:5432/fde_test
      TEST_DATABASE_URL: postgresql://fde_test:ci-only-password@localhost:5432/fde_test
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type check
        run: uv run mypy src tests scripts

      - name: Migrate database
        run: uv run alembic upgrade head

      - name: Test
        run: >-
          uv run pytest
          --cov=fde_foundation
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=test-results.xml

      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.sha }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: error
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare disposable container configuration
        run: cp .env.example .env

      - name: Validate and build image
        run: |
          docker compose --profile api --profile integration --profile integration-smoke config --quiet
          docker build --check .
          docker compose --profile api build api

      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: customer-data-foundation-api:local
          version: v0.72.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Start migrated stack
        run: docker compose --profile api --profile integration up -d --wait api partner_api integration_worker

      - name: Verify runtime isolation
        run: |
          for service in api partner_api integration_worker; do
            container_id="$(docker compose ps -q "$service")"
            test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "10001:10001"
            test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_id")" = "true"
            test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$container_id")" = '["ALL"]'
            test "$(docker compose exec -T "$service" id -u)" = "10001"
          done

      - name: Import from isolated smoke client
        run: |
          operator_token="$(docker compose exec -T api fde-dev-token --subject container-smoke --role operator)"
          OPERATOR_TOKEN="$operator_token" docker compose --profile api --profile smoke run --rm api_smoke

      - name: Deliver signed event after simulated partner failure
        run: |
          operator_token="$(docker compose exec -T api fde-dev-token --subject integration-smoke --role operator)"
          OPERATOR_TOKEN="$operator_token" docker compose --profile api --profile integration --profile integration-smoke run --rm integration_smoke

      - name: Verify graceful shutdown
        run: |
          api_id="$(docker compose ps -q api)"
          partner_id="$(docker compose ps -q partner_api)"
          worker_id="$(docker compose ps -q integration_worker)"
          docker compose stop -t 15 integration_worker partner_api api
          test "$(docker inspect --format '{{.State.ExitCode}}' "$api_id")" = "0"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$partner_id")" = "0"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$worker_id")" = "0"

      - name: Show safe API logs on failure
        if: failure()
        run: docker compose logs api

      - name: Remove disposable stack
        if: always()
        run: docker compose --profile api --profile smoke --profile integration --profile integration-smoke down --volumes --remove-orphans

  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.image_changes.outputs.publish == 'true'
    needs: [image_changes, quality, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/customer-data-foundation-api
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define immutable and convenience tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=main

      - name: Build and publish multi-platform image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull and inspect the immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME@$IMAGE_DIGEST"
          docker pull --platform linux/amd64 "$IMAGE_NAME@$IMAGE_DIGEST"
          test "$(docker image inspect "$IMAGE_NAME@$IMAGE_DIGEST" --format '{{.Config.User}}')" = "10001:10001"

      - name: Scan the published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}
          version: v0.72.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE_NAME@$IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --predicate-type https://slsa.dev/provenance/v1

      - name: Verify SBOM attestation
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE_NAME@$IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --predicate-type https://spdx.dev/Document

      - name: Write supply-chain manifest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          sbom_digest="$(sha256sum sbom.spdx.json | cut -d ' ' -f 1)"
          jq -n \
            --arg image "$IMAGE_NAME" \
            --arg digest "$IMAGE_DIGEST" \
            --arg commit "$GITHUB_SHA" \
            --arg sbom_sha256 "$sbom_digest" \
            '{image: $image, digest: $digest, commit: $commit, sbom: {file: "sbom.spdx.json", sha256: $sbom_sha256}}' \
            > supply-chain-manifest.json

      - name: Upload SBOM and immutable manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ github.sha }}
          path: |
            sbom.spdx.json
            supply-chain-manifest.json
          if-no-files-found: error
          retention-days: 30
