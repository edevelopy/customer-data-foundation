name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: fde_test
          POSTGRES_USER: fde_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fde_test -d fde_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fde_test:ci-only-password@localhost:5432/fde_test
      TEST_DATABASE_URL: postgresql://fde_test:ci-only-password@localhost:5432/fde_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Migrate database
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare disposable container configuration
        run: cp .env.example .env

      - name: Validate and build image
        run: |
          docker compose --profile api config --quiet
          docker build --check .
          docker compose --profile api build api

      - name: Start migrated stack
        run: docker compose --profile api up -d --wait api

      - name: Verify runtime isolation
        run: |
          container_id="$(docker compose ps -q api)"
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "10001:10001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_id")" = "true"
          test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$container_id")" = '["ALL"]'
          test "$(docker compose exec -T api id -u)" = "10001"

      - name: Import from isolated smoke client
        run: |
          operator_token="$(docker compose exec -T api fde-dev-token --subject container-smoke --role operator)"
          OPERATOR_TOKEN="$operator_token" docker compose --profile api --profile smoke run --rm api_smoke

      - name: Verify graceful shutdown
        run: |
          container_id="$(docker compose ps -q api)"
          docker compose stop -t 15 api
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" = "0"

      - name: Show safe API logs on failure
        if: failure()
        run: docker compose logs api

      - name: Remove disposable stack
        if: always()
        run: docker compose --profile api --profile smoke down --volumes --remove-orphans
