name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: fde_test
          POSTGRES_USER: fde_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fde_test -d fde_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fde_test:ci-only-password@localhost:5432/fde_test
      TEST_DATABASE_URL: postgresql://fde_test:ci-only-password@localhost:5432/fde_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Migrate database
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest
