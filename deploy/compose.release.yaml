name: ${DEPLOY_PROJECT_NAME:-cdf-release}

services:
  database:
    image: pgvector/pgvector:pg18-trixie@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e
    restart: unless-stopped
    environment:
      POSTGRES_DB: fde_release
      POSTGRES_USER: fde_release
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - release_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fde_release -d fde_release"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  preflight:
    image: ${IMAGE_REF:?set immutable IMAGE_REF with sha256 digest}
    command: ["fde-config-check", "api", "worker", "partner"]
    restart: "no"
    environment: &application_environment
      APP_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      INTEGRATION_DATABASE_URL_FILE: /run/secrets/database_url
      PARTNER_DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      IDENTIFIER_HASH_KEY_FILE: /run/secrets/identifier_hash_key
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      PARTNER_WEBHOOK_SECRET_FILE: /run/secrets/partner_webhook_secret
      JWT_ISSUER: ${JWT_ISSUER:-fde-release}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fde-release-clients}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      PARTNER_API_HOST: 0.0.0.0
      PARTNER_API_PORT: 8001
      PARTNER_WEBHOOK_URL: http://partner_api:8001/partner/v1/import-events
      PARTNER_SIMULATED_FAILURES: ${PARTNER_SIMULATED_FAILURES:-0}
      INTEGRATION_TIMEOUT_MS: 2000
      INTEGRATION_MAX_ATTEMPTS: 5
      INTEGRATION_BASE_BACKOFF_SECONDS: 1
      INTEGRATION_MAX_BACKOFF_SECONDS: 30
      INTEGRATION_LEASE_SECONDS: 30
      INTEGRATION_POLL_SECONDS: 0.25
    secrets: &application_secrets
      - database_url
      - jwt_secret
      - identifier_hash_key
      - metrics_token
      - partner_webhook_secret
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  migrate:
    image: ${IMAGE_REF:?set immutable IMAGE_REF with sha256 digest}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      database:
        condition: service_healthy
      preflight:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  api:
    image: ${IMAGE_REF:?set immutable IMAGE_REF with sha256 digest}
    restart: unless-stopped
    environment:
      <<: *application_environment
    secrets: *application_secrets
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${DEPLOY_API_PORT:-8080}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 15s
    networks:
      - backend
      - edge

  partner_api:
    image: ${IMAGE_REF:?set immutable IMAGE_REF with sha256 digest}
    command: ["fde-partner-api"]
    restart: unless-stopped
    environment:
      <<: *application_environment
    secrets: *application_secrets
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    networks:
      - backend

  integration_worker:
    image: ${IMAGE_REF:?set immutable IMAGE_REF with sha256 digest}
    command: ["fde-integration-worker"]
    restart: unless-stopped
    environment:
      <<: *application_environment
    secrets: *application_secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
      partner_api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; raise SystemExit(not Path('/tmp/fde-integration-worker-ready').exists())",
        ]
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 12
    stop_grace_period: 15s
    networks:
      - backend

  release_smoke:
    profiles: ["smoke"]
    image: ${IMAGE_REF:?set immutable IMAGE_REF with sha256 digest}
    command: ["python", "/smoke/integration_smoke.py"]
    environment:
      API_BASE_URL: http://api:8000
      OPERATOR_TOKEN_FILE: /run/secrets/operator_token
    secrets:
      - operator_token
    depends_on:
      api:
        condition: service_healthy
      partner_api:
        condition: service_healthy
      integration_worker:
        condition: service_healthy
    volumes:
      - ../scripts/integration_smoke.py:/smoke/integration_smoke.py:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    networks:
      - backend

secrets:
  postgres_password:
    file: ${DEPLOY_SECRETS_DIR:?set absolute DEPLOY_SECRETS_DIR}/postgres_password
  database_url:
    file: ${DEPLOY_SECRETS_DIR:?set absolute DEPLOY_SECRETS_DIR}/database_url
  jwt_secret:
    file: ${DEPLOY_SECRETS_DIR:?set absolute DEPLOY_SECRETS_DIR}/jwt_secret
  identifier_hash_key:
    file: ${DEPLOY_SECRETS_DIR:?set absolute DEPLOY_SECRETS_DIR}/identifier_hash_key
  metrics_token:
    file: ${DEPLOY_SECRETS_DIR:?set absolute DEPLOY_SECRETS_DIR}/metrics_token
  partner_webhook_secret:
    file: ${DEPLOY_SECRETS_DIR:?set absolute DEPLOY_SECRETS_DIR}/partner_webhook_secret
  operator_token:
    file: ${DEPLOY_SECRETS_DIR:?set absolute DEPLOY_SECRETS_DIR}/operator_token

volumes:
  release_database:

networks:
  backend:
    internal: true
  edge:
