[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fde-customer-data-foundation"
version = "0.3.1"
description = "API empresarial reproducible para importar e integrar datos de clientes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18,<2",
    "fastapi>=0.115,<1",
    "openai>=2.0,<3",
    "pyjwt>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
fde-config-check = "fde_foundation.config_check:main"
fde-diagnose = "fde_foundation.diagnostic:main"
fde-api = "fde_foundation.api:run"
fde-backup = "fde_foundation.backup:main"
fde-dev-token = "fde_foundation.dev_token:main"
fde-import = "fde_foundation.importer:main"
fde-integration-worker = "fde_foundation.integration_worker:run"
fde-ops-check = "fde_foundation.operations:main"
fde-partner-api = "fde_foundation.partner_api:run"
fde-release = "fde_foundation.release:main"
fde-release-fixture = "fde_foundation.release_fixture:main"
fde-validate = "fde_foundation.validation:main"

[dependency-groups]
dev = [
    "httpx2>=2.7,<3",
    "mypy>=1.18,<2",
    "pytest>=8.0",
    "pytest-cov>=7,<8",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fde_foundation"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: requires a disposable PostgreSQL database",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["fde_foundation"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
