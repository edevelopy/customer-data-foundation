[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fde-customer-data-foundation"
version = "0.1.0"
description = "Plantilla reproducible para la Fase 0 de la ruta FDE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fde-diagnose = "fde_foundation.diagnostic:main"
fde-validate = "fde_foundation.validation:main"


[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fde_foundation"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
